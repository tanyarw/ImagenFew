# ==============================================================================
# v18 — v14 with the data scaled to match EDM's sigma_data (single-variable ablation)
# ==============================================================================
# IDENTICAL to config_v14.yaml except for ONE thing: after the asinh transform and
# standardising, every value is multiplied by 0.5 (regime_training/transforms.py,
# ScaledScaler), so the data have standard deviation 0.5.
#
# Why: EDM's preconditioning and loss weight assume the data have standard
# deviation sigma_data, which ImagenFew hard-codes as 0.5; our standardised data
# have 1 (code_plan/LOSS_FUNCTION.md finding 4). Measured on v14: the weighted
# loss climbs to 4 at large sigma instead of levelling at 1. Scaling the data
# (rather than setting sigma_data = 1) keeps P_mean, P_std, sigma_min, sigma_max
# at the values EDM tuned for data of std 0.5, and keeps the pretrained
# checkpoint's preconditioning meaning what it did in pretraining.
#
# The scaler pickled to scaler.pkl includes the factor, so generation inverts it
# with no code change. Plan: code_plan/STRENGTHENING_RUNS.md, run 6.
# ==============================================================================

# --- Training ---
epochs: 500
batch_size: 2048
learning_rate: 0.0001    # 1e-4
weight_decay: 0.00001    # 1e-5

# --- Loss: matching v7/v8 exact baseline ---
# alpha = 0.0 reproduces v7/v8 unweighted loss baseline
intensity_weight_alpha: 0.0
intensity_weight_gamma: 0.5
intensity_weight_normalize: true
fft_weight: 1.0
grad_clip: 1.0

# --- Data: Clean Chronological Holdout Datasets ---
train_csv: data/rainfall/splits/train_years_labelled.csv
test_csv: data/rainfall/splits/val_years_labelled.csv
seq_len: 64
n_classes: 4   # 4 seasonal phases (0: Dry Baseline -> 3: Peak Cloudburst)

# --- Column names ---
regime_col: hmm_state
data_col: avg_rainfall

# --- Rainfall -> model-space transform (the ONLY change vs v10) ---
data_transform: asinh    # 'standard' = v10 behaviour
asinh_scale: 0.035       # s in mm/5min = median wet step (>= 0.005 mm), 2000-2007 train split

# --- Transform (Delay Embedding) ---
use_stft: false
delay: 8
embedding: 8

# --- Model Architecture (must match base checkpoint) ---
handler: models.ImagenFew.handler
img_resolution: 8
input_channels: 1
unet_channels: 32
ch_mult: [1, 2, 2, 4]
attn_resolution: [8, 4, 2]
diffusion_steps: 36
dynamic_size: [128, 128]

# --- Diffusion Sampler ---
beta1: 0.00001      # 1e-5
betaT: 0.01         # 1e-2
deterministic: false

# --- Fine-tuning ---
finetune: true
pretrain: false
ema: true
ema_warmup: 100
ft_method: all       # fine-tune all parameters
lora_dim: 4          # ignored when ft_method != 'lora'
dropout: 0.10

# --- Logging & Monitoring ---
logging_iter: 25       # Log metrics, evaluate regimes, and update plots every 25 epochs
run_id: null           # auto-generated if null
run_dir: ImagenFew/Rainfall_v18/

# --- Scale the model-space data to std 0.5 = sigma_data (the ONLY change vs v14) ---
data_scale: 0.5
