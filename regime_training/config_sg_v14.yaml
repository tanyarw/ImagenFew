- 1
- 2
- 2
- 4
attn_resolution:
- 8
- 4
- 2
diffusion_steps: 36
dynamic_size:
- 128
- 128
beta1: 1.0e-05
betaT: 0.01
deterministic: false
finetune: true
pretrain: false
ema: true
ema_warmup: 100
ft_method: all
lora_dim: 4
